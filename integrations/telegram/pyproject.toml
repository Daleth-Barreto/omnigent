[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnigent-telegram"
version = "0.1.0"
description = "Telegram bot integration that drives Omnigent sessions with progressive streaming and inline approvals."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "aiohttp>=3.12.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.10.0",
    "python-telegram-bot>=21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/omnigent_telegram"]

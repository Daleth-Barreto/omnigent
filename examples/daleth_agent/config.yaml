# Daleth Agent — Development assistant with isolated external MCP tools.
# Wires official and contrib MCP servers: Playwright, Context7, and TestSprite.
spec_version: 1
name: daleth_agent
description: >-
  A development assistant that uses isolated external tools: Playwright for
  web navigation, Context7 for up-to-date documentation, and TestSprite for E2E testing.

executor:
  type: omnigent
  config:
    harness: claude-sdk

tools:
  context7:
    type: mcp
    command: npx
    args: ["-y", "@upstash/context7-mcp@latest"]

  playwright:
    type: mcp
    command: npx
    args: ["-y", "@playwright/mcp@latest"]

  testsprite:
    type: mcp
    command: python
    args: ["-m", "mcp_testsprite"]
    env:
      PYTHONPATH: contrib/mcp-testsprite/src

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

prompt: |
  You are an intelligent development agent (daleth_agent) equipped with isolated,
  high-performance external tools running via the Model Context Protocol (MCP):

  - `context7`: Always use this to fetch up-to-date documentation, migration guides,
    or official code examples for any library or framework. Do not guess newer APIs;
    query Context7 first.
  - `playwright`: Use this to automate browser navigation, inspect elements, click,
    type text, and capture screenshots to verify web implementations or debug UI failures.
  - `testsprite`: Use this to verify test suites, check configurations, and invoke the
    TestSprite CLI (`testsprite_check`, `testsprite_run`) in cloud or local environments.

  Key rules:
  1. Always preserve codebase stability and architectural isolation.
  2. If an external tool (MCP) fails or times out, handle the error gracefully and report
     it to the user without abruptly terminating the workflow.
  3. For web UI or E2E tasks, verify your changes using `playwright` or `testsprite` when applicable.


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-testsprite"
version = "0.1.0"
description = "Model Context Protocol (MCP) server wrapper around TestSprite CLI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_testsprite"]
